name: Check and release

"on":
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check extension
        run: |
          node test.mjs
          node --check background.js
          node --check content.js
          node -e 'JSON.parse(require("node:fs").readFileSync("manifest.json", "utf8"))'
      - name: Check package
        run: |
          git archive --format=zip --output=titleless.zip HEAD manifest.json background.js content.js reddit.css icon-128.png
          unzip -t titleless.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package extension
        id: package
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          test "v$version" = "$GITHUB_REF_NAME"
          archive="titleless-$version.zip"
          git archive --format=zip --output="$archive" HEAD manifest.json background.js content.js reddit.css icon-128.png
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --verify-tag --generate-notes --title "Titleless ${GITHUB_REF_NAME#v}"
